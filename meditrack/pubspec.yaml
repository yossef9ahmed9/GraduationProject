name: meditrack
description: MediTrack - Healthcare Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.2
  signalr_netcore: ^1.4.4
  mime: ^2.0.0
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  jwt_decoder: ^2.0.1
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
